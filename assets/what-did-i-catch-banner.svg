<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">WHAT DID I CATCH?</title>
<desc id="desc">Animated arcade-fishing banner with a tiny boat, a mysterious glowing catch, and deep ocean colours.</desc>
<defs>
 <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12628a"/><stop offset=".48" stop-color="#07334d"/><stop offset="1" stop-color="#041621"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff2a8"/><stop offset=".48" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff8b24"/></linearGradient>
