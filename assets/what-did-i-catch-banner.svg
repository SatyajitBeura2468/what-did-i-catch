<text x="151" y="91" fill="#a3fff0" font-family="Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="4">BEURA LABS PRESENTS</text>
<text x="75" y="201" fill="#ffffff" font-family="'Trebuchet MS',Arial,sans-serif" font-size="64" font-weight="900" letter-spacing="1.5">WHAT DID</text>
<text x="75" y="278" fill="url(#gold)" stroke="#06243a" stroke-width="3" paint-order="stroke fill" font-family="'Trebuchet MS',Arial,sans-serif" font-size="83" font-weight="900" letter-spacing="1.5">I CATCH<tspan fill="#ff5a5a">?</tspan></text>
<text x="80" y="324" fill="#d6f5ff" font-family="Arial,sans-serif" font-size="21">A perfectly normal fishing game.</text>
<g transform="translate(80 365)">
 <rect width="145" height="43" rx="21.5" fill="url(#gold)" stroke="#06243a" stroke-width="2.5"/><text x="72" y="27" text-anchor="middle" fill="#06243a" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="1">CAST. WAIT.</text>
 <rect x="159" width="145" height="43" rx="21.5" fill="#ffffff" fill-opacity=".09" stroke="#a3fff0" stroke-opacity=".5" stroke-width="1.5"/><text x="231" y="27" text-anchor="middle" fill="#eafaff" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="1">REEL. PRAY.</text>
</g>
<text x="80" y="466" fill="#8ebaca" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">5 ZONES · 5 RARITY TIERS · UNREASONABLE OCEAN OBJECTS</text>
