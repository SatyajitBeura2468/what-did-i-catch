<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">WHAT DID I CATCH? game preview</title><desc id="desc">Illustrative game interface preview featuring a fishing boat, ocean, cast button, fish collection and a rare catch reveal.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#082e45"/><stop offset="1" stop-color="#020e18"/></linearGradient><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#114e78"/><stop offset="1" stop-color="#18a8bd"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1596b2"/><stop offset="1" stop-color="#06294d"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff2a8"/><stop offset="1" stop-color="#ffac00"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="13" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter></defs>
