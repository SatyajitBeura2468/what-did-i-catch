<text x="68" y="111" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="900">A little patience. An unreasonable ocean.</text>
<text x="68" y="145" fill="#a9c9d8" font-family="Arial,sans-serif" font-size="17">Every cast is a mystery. Some mysteries are definitely not fish.</text>
